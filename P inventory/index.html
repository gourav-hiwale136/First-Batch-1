<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="create">
        <h3>Add Products in Inventory</h3>
        <form>
          <input  id="name" placeholder="Product Name" type="text" />
          <select id="catagory">
            <option value="">Product Catagory</option>
            <option value="Grocery">Grocery</option>
            <option value="Electronics">Electronics</option>
            <option value="Fashion">Fashion</option>
            <option value="Home Appliances">Home Appliances</option>
          </select>
          <input  id="brand" type="text" placeholder="Brand" />
          <input id="price" placeholder="Product Price"  type="number" />
          <select id="deliveredBy">
            <option value="">Delivered By</option>
            <option value="Plane">Plane</option>
            <option value="Ship">Ship</option>
            <option value="Delivery Van">Delivery Van</option>
          </select>
          <input type="submit" value="Add Inventory" />
        </form>
      </div>
      <!-- This is the h1 tag for showing the total price  -->
      <h1 id="total-price">Total Price:- 0</h1>
      <table border="1">
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Catagory</th>
            <th>Brand</th>
            <th>Price</th>
            <th>Delivered By</th>
            <th>Price Segment</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
</body>
<script src="./index.js"></script>
</html>
